id = "yel"
name = "Yel"
version = "0.1.0"
schema_version = 1
authors = ["Sz. Kovács Roland"]
description = "yel2: highlighting, outline and indentation (Tree-sitter), the compiler's errors and formatting (yel-lsp)."
repository = "https://github.com/szkabaroli/yel2"

# the grammar (editors/tree-sitter-yel), as Zed builds one: from a git repository at a commit (dev.sh
# points it at a snapshot in build/ while the grammar is changed locally)
[grammars.yel]
repository = "https://github.com/szkabaroli/yel2"
rev = "f78a8c30a5b7f8c4dc95252f2f083e3a10656332"
path = "editors/tree-sitter-yel"

[language_servers.yel-lsp]
name = "yel-lsp"
languages = ["Yel"]
